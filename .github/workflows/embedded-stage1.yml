name: Embedded Stage 1

on:
  push:
    branches: ["embedded-stage1"]
  pull_request:
    branches: ["main"]

jobs:
  native-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dictionary export dependency
        run: python -m pip install numpy
      - name: Export frozen dictionary to C header
        run: python embedded/tools/export_dictionary.py --input models/nmf/W_standard.npy --output embedded/src/w_standard_data.h
      - name: Configure host build
        run: cmake -S embedded -B embedded/build -A x64
      - name: Build
        run: cmake --build embedded/build --config Release
      - name: Run Stage 1 smoke tests
        run: ctest --test-dir embedded/build -C Release --output-on-failure
